name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for DB to be ready
        run: |
          for i in {1..60}; do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T db pg_isready -U postgres >/dev/null 2>&1; then
              echo "DB is ready!"
              exit 0
            fi
            echo "Waiting for DB..."
            sleep 2
          done
          echo "DB not ready in time"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs db
          exit 1

      - name: Seed baza
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T app npx prisma db seed

      - name: Wait for app to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf "http://localhost:3000/api/faq?limit=1" >/dev/null; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not start in time"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Run tests inside app container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T app npm test

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
